<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – PrairiePin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#085e46',
            accent: '#8cc084',
            softgreen: '#F1FDF4',
            softgray: '#F5F6F8',
            steel: '#91a2a8'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-softgray min-h-screen flex items-center justify-center">
  <main class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
  <img src="/images/prairiepin-logo.png" alt="PrairiePin Logo" class="h-10">
    <form id="loginForm" class="space-y-4">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
        <input type="email" id="email" name="email" required class="mt-1 block w-full border border-gray-300 rounded-md p-2" />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
        <input type="password" id="password" name="password" required class="mt-1 block w-full border border-gray-300 rounded-md p-2" />
      </div>

      <div id="error" class="text-red-600 hidden text-sm">Invalid credentials. Please try again.</div>

      <button type="submit" class="w-full bg-primary text-white py-2 rounded hover:bg-green-800">Log In</button>
    </form>
  </main>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const res = await fetch('https://prairiepin-production.up.railway.app/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ email, password })
      });

      if (res.ok) {
        window.location.href = '/dashboard.html';
      } else {
        document.getElementById('error').classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
